[package]
name = "tcpshow"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "简单直接的 HTTP/HTTPS 抓包工具"
publish = false

[[bin]]
name = "TcpShow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
dirs = "6"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false }
eframe = "0.31"
egui = "0.31"
egui_extras = "0.31"
flate2 = "1"
brotli = "7"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "native-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
p256 = { version = "0.13", features = ["pem"] }
parking_lot = "0.12"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde_json = "1"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
